<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f2ea">
  <meta name="description" content="日序：按日期记录生活、体育与学习计划，自动提醒未来安排。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="日序">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <title>日序 · 我的每日计划</title>
</head>
<body>
  <div class="ambient ambient-a" aria-hidden="true"></div>
  <div class="ambient ambient-b" aria-hidden="true"></div>

  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" id="brandHome" aria-label="回到今天">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <circle cx="16" cy="16" r="7.5" stroke="currentColor" stroke-width="1.8"/>
            <path d="M16 3v3M16 26v3M3 16h3M26 16h3M6.8 6.8l2.1 2.1M23.1 23.1l2.1 2.1M25.2 6.8l-2.1 2.1M8.9 23.1l-2.1 2.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="brand-copy">
          <strong>日序</strong>
        </span>
      </a>

      <div class="topbar-actions">
        <button class="icon-button" id="openSettings" type="button" aria-label="设置与备份" title="设置">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/>
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.86 2.86-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21H9.55v-.1A1.7 1.7 0 0 0 8.5 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.86-2.86.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3V9.55h.1A1.7 1.7 0 0 0 4.6 8.5a1.7 1.7 0 0 0-.34-1.88l-.06-.06L7.06 3.7l.06.06A1.7 1.7 0 0 0 9 4.1a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V2h4.05v.1A1.7 1.7 0 0 0 15.5 3.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.86 2.86-.06.06A1.7 1.7 0 0 0 19.9 8c.15.39.36.74.65 1.04.3.29.68.45 1.08.46H22v4.05h-.1A1.7 1.7 0 0 0 20.4 15Z" stroke="currentColor" stroke-width="1.45" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </header>

    <main>
      <section class="month-calendar" aria-labelledby="homeMonthLabel">
        <div class="calendar-header">
          <h2 id="homeMonthLabel">2026年11月</h2>
          <div class="calendar-controls">
            <button class="today-chip" id="goToday" type="button">今天</button>
            <button class="mini-button" id="homePrevMonth" type="button" aria-label="上个月">
              <svg viewBox="0 0 20 20" fill="none"><path d="m12.5 4.5-5 5.5 5 5.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button class="mini-button" id="homeNextMonth" type="button" aria-label="下个月">
              <svg viewBox="0 0 20 20" fill="none"><path d="m7.5 4.5 5 5.5-5 5.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
        <div class="month-weekdays" aria-hidden="true">
          <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
        </div>
        <div class="month-grid" id="homeMonthGrid"></div>
        <div class="calendar-legend" aria-label="日期标记说明">
          <span><i class="holiday-mark">休</i>放假</span>
          <span><i class="workday-mark">班</i>调休上班</span>
          <span><i class="festival-mark">节</i>传统节日</span>
        </div>
      </section>

      <section class="plan-section" aria-labelledby="planHeading">
        <div class="section-heading">
          <div>
            <h2 id="planHeading">当天分类</h2>
          </div>
          <span class="section-count" id="planCount">0 项</span>
        </div>
        <div class="category-stack" id="categoryStack"></div>
      </section>

      <footer class="app-footer">
        <span>日序</span>
        <span class="footer-separator">·</span>
        <span>数据仅保存在当前设备</span>
      </footer>
    </main>
  </div>

  <div class="add-bar">
    <button class="add-button" id="addTask" type="button">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      添加计划
    </button>
  </div>

  <dialog class="sheet task-dialog" id="taskDialog">
    <form class="sheet-form" id="taskForm" method="dialog" novalidate>
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-header">
        <div>
          <span class="section-kicker" id="taskFormKicker">NEW PLAN</span>
          <h2 id="taskFormTitle">添加计划</h2>
        </div>
        <button class="icon-button close-button" type="button" data-close="taskDialog" aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>

      <input type="hidden" id="taskId">
      <div class="field">
        <label for="taskTitle">要做什么</label>
        <input id="taskTitle" name="title" type="text" maxlength="80" placeholder="例如：整理下周的学习资料" autocomplete="off" required>
      </div>

      <fieldset class="field category-field">
        <legend>属于哪一类</legend>
        <div class="category-picker" id="categoryPicker">
          <label class="category-option life">
            <input type="radio" name="category" value="life" checked>
            <span class="category-option-inner">
              <span class="category-icon">
                <svg viewBox="0 0 24 24" fill="none"><path d="m4 10 8-6 8 6v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1v-9Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
              </span>
              生活
            </span>
          </label>
          <label class="category-option sport">
            <input type="radio" name="category" value="sport">
            <span class="category-option-inner">
              <span class="category-icon">
                <svg viewBox="0 0 24 24" fill="none"><path d="M7.2 7.2 5 5M16.8 7.2 19 5M7.2 16.8 5 19M16.8 16.8 19 19M8 8l8 8M8 16l8-8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
              </span>
              体育
            </span>
          </label>
          <label class="category-option study">
            <input type="radio" name="category" value="study">
            <span class="category-option-inner">
              <span class="category-icon">
                <svg viewBox="0 0 24 24" fill="none"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v16H6.5A2.5 2.5 0 0 0 4 21.5v-16ZM20 5.5A2.5 2.5 0 0 0 17.5 3H13v16h4.5a2.5 2.5 0 0 1 2.5 2.5v-16Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
              </span>
              学习
            </span>
          </label>
        </div>
      </fieldset>

      <div class="form-row">
        <div class="field">
          <label for="taskDate">日期</label>
          <input id="taskDate" name="date" type="date" required>
        </div>
        <div class="field">
          <label for="taskTime">时间 <span class="optional">选填</span></label>
          <input id="taskTime" name="time" type="time">
        </div>
      </div>

      <div class="field">
        <label for="taskNote">备注 <span class="optional">选填</span></label>
        <textarea id="taskNote" name="note" rows="3" maxlength="240" placeholder="补充地点、目标或需要准备的东西"></textarea>
      </div>

      <div class="form-actions">
        <button class="danger-button" id="deleteTask" type="button">删除</button>
        <span class="form-spacer"></span>
        <button class="secondary-button" type="button" data-close="taskDialog">取消</button>
        <button class="primary-button" type="submit">保存</button>
      </div>
    </form>
  </dialog>

  <dialog class="sheet settings-dialog" id="settingsDialog">
    <div class="sheet-body">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-header">
        <div>
          <span class="section-kicker">SETTINGS</span>
          <h2>设置与备份</h2>
        </div>
        <button class="icon-button close-button" type="button" data-close="settingsDialog" aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="privacy-card">
        <span class="privacy-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 3 5 6v5c0 4.6 2.9 8 7 10 4.1-2 7-5.4 7-10V6l-7-3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="m9 12 2 2 4-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <div>
          <strong>你的计划只保存在这台设备</strong>
          <p>不会上传云端。清除浏览器数据前，请先导出备份。</p>
        </div>
      </div>

      <div class="settings-group">
        <button class="settings-row" id="exportData" type="button">
          <span class="settings-row-icon">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v12M7 10l5 5 5-5M5 20h14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span><strong>导出备份</strong><small>保存为 JSON 文件</small></span>
          <svg class="chevron" viewBox="0 0 20 20" fill="none"><path d="m8 5 5 5-5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>

        <label class="settings-row" for="importData">
          <span class="settings-row-icon">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 16V4M7 9l5-5 5 5M5 20h14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span><strong>导入备份</strong><small>从 JSON 文件恢复</small></span>
          <svg class="chevron" viewBox="0 0 20 20" fill="none"><path d="m8 5 5 5-5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </label>
        <input id="importData" type="file" accept="application/json,.json" hidden>
      </div>

      <div class="install-tip" id="installTip">
        <strong>加到手机主屏幕</strong>
        <p id="installTipText">在手机浏览器菜单中选择“添加到主屏幕”，以后就能像 App 一样快速打开。</p>
      </div>

      <button class="clear-data-button" id="clearData" type="button">清除全部计划</button>
      <p class="version-note">日序 1.0 · 本地优先</p>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="./app.js" defer></script>
</body>
</html>
